<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 탐구 & 코드 공유 스튜디오</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { margin: 0; padding: 0; background-color: #121212; color: #fff; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #app-container { width: 90%; max-width: 700px; background: #1e1e1e; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); padding: 25px; border: 2px solid #333; box-sizing: border-box; }
        .title { font-family: 'Black Han Sans', sans-serif; font-size: 26px; color: #00ffcc; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #aaa; margin-bottom: 20px; font-size: 13px; text-align: center; }
        .screen { display: none; }
        .active { display: block; }
        .menu-btn, .action-btn { display: block; width: 100%; background: #2a2a2a; color: #fff; border: 2px solid #444; border-radius: 10px; padding: 15px; margin-bottom: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: left; }
        .menu-btn:hover { background: #00ffcc; color: #000; border-color: #00ffcc; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        input[type="text"], input[type="password"], textarea { width: 100%; background: #000; color: #00ffcc; border: 2px solid #444; border-radius: 8px; padding: 12px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #00ffcc; }
        .action-btn { background: #ff0055; text-align: center; font-size: 16px; margin-top: 5px; }
        .sub-btn { background: #444; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 13px; color: #aaa; cursor: pointer; }
        .switch-link span { color: #00ffcc; font-weight: bold; text-decoration: underline; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .admin-badge { background: #ff0055; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .board-container { max-height: 180px; overflow-y: auto; margin-top: 15px; }
        .post-card { background: #252525; border-left: 4px solid #00ffcc; padding: 10px; border-radius: 6px; margin-bottom: 8px; position: relative; }
        .post-author { font-weight: bold; color: #00ffcc; font-size: 12px; margin-bottom: 3px; }
        .post-title { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #fff; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: #ff4444; color: #fff; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .run-code-btn { background: #00bfff; color: #000; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-top: 4px; }
        .admin-panel { background: #221515; border: 1px solid #ff0055; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: #111; padding: 6px 10px; border-radius: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 90%; max-width: 500px; border: 2px solid #00ffcc; box-sizing: border-box; text-align: center; }
        .preview-frame { width: 100%; height: 280px; background: #fff; border-radius: 8px; border: none; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="app-container">
        <div class="title">사이버 탐구 & 코드 공유 스튜디오</div>
        <div class="subtitle">서버 연동형 실시간 동아리 플랫폼</div>

        <div id="main-menu-screen" class="screen active">
            <button class="menu-btn" onclick="checkLoginStatus()">💬 동아리 코드 공유 스튜디오 (로그인 & 게시판)</button>
        </div>

        <div id="login-screen" class="screen">
            <div class="box">
                <h3 style="margin-top:0; color:#00ffcc; text-align:center;">로그인</h3>
                <input type="text" id="login-id" placeholder="아이디">
                <input type="password" id="login-pw" placeholder="비밀번호">
                <button class="action-btn" onclick="processLogin()">로그인</button>
                <div class="switch-link" onclick="changeScreen('signup')">계정이 없나요? <span>회원가입하기</span></div>
                <button class="action-btn sub-btn" onclick="goHome()">메인으로</button>
            </div>
        </div>

        <div id="signup-screen" class="screen">
            <div class="box">
                <h3 style="margin-top:0; color:#00ffcc; text-align:center;">회원가입</h3>
                <input type="text" id="signup-id" placeholder="아이디 (관리자는 admin)">
                <input type="password" id="signup-pw" placeholder="비밀번호">
                <button class="action-btn" onclick="processSignup()">가입 완료</button>
                <div class="switch-link" onclick="changeScreen('login')">이미 계정이 있나요? <span>로그인하기</span></div>
                <button class="action-btn sub-btn" onclick="goHome()">메인으로</button>
            </div>
        </div>

        <div id="board-screen" class="screen">
            <div class="user-info">
                <div>계정: <b id="display-user" style="color:#00ffcc;"></b> <span id="badge-area"></span></div>
                <div>
                    <button onclick="openChangePwModal()" style="background:none; border:none; color:#00ffcc; cursor:pointer; font-size:11px; margin-right:3px;">비번변경</button>
                    <button onclick="showQrCode()" style="background:none; border:none; color:#00ffcc; cursor:pointer; font-size:11px; margin-right:3px;">QR로그인</button>
                    <button onclick="processLogout()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:11px;">로그아웃</button>
                </div>
            </div>

            <div id="pw-change-box" style="display:none; background:#252525; padding:10px; border-radius:8px; margin-bottom:10px;">
                <input type="password" id="current-pw-input" placeholder="현재 비밀번호" style="margin-bottom:5px; font-size:12px; padding:7px;">
                <input type="password" id="new-pw-input" placeholder="새 비밀번호" style="margin-bottom:5px; font-size:12px; padding:7px;">
                <button class="action-btn" onclick="updatePassword()" style="padding:6px; font-size:12px;">변경하기</button>
            </div>

            <input type="text" id="code-title" placeholder="웹페이지 제목" style="margin-bottom:6px; padding:8px; font-size:13px;">
            <textarea id="html-code-input" placeholder="&lt;h1&gt;내 코드&lt;/h1&gt;" style="height:70px; margin-bottom:6px;"></textarea>
            <button class="action-btn" onclick="shareCode()" style="padding:8px; font-size:14px;">코드 공유하기</button>

            <div style="margin-top:12px; font-size:13px; font-weight:bold; color:#00ffcc;">🌍 실시간 공유된 목록</div>
            <div class="board-container" id="posts-container"></div>

            <div id="admin-control-panel" class="admin-panel" style="display:none;">
                <div style="font-weight:bold; color:#ff0055; margin-bottom:6px;">⚙️ 관리자: 회원 관리</div>
                <div id="user-list-container"></div>
            </div>
            
            <button class="action-btn sub-btn" onclick="goHome()" style="font-size:12px; padding:5px; margin-top:10px;">메인으로</button>
        </div>
    </div>

    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:#00ffcc; margin-top:0; font-size:16px;">미리보기</h3>
            <iframe class="preview-frame" id="preview-frame"></iframe>
            <button class="action-btn" onclick="closePreview()" style="margin-top:10px; padding:8px;">닫기</button>
        </div>
    </div>

    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#00ffcc; margin-top:0;">QR 로그인</h3>
            <div id="qrcode-box" style="display:flex; justify-content:center; margin:15px 0; background:#fff; padding:10px; border-radius:8px;"></div>
            <button class="action-btn" onclick="closeQrModal()" style="padding:8px; font-size:14px;">닫기</button>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem("active_user") || null;

        function changeScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(name + '-screen').classList.add('active');
        }

        function goHome() {
            document.getElementById("pw-change-box").style.display = "none";
            changeScreen('main-menu');
        }

        function checkLoginStatus() {
            if (currentUser) {
                showBoardScreen(currentUser);
            } else {
                changeScreen('login');
            }
        }

        async function processSignup() {
            let id = document.getElementById("signup-id").value.trim();
            let pw = document.getElementById("signup-pw").value.trim();
            let res = await fetch('/api/signup', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, pw })
            });
            let data = await res.json();
            if (data.success) { alert("가입 완료!"); changeScreen('login'); }
            else { alert(data.msg); }
        }

        async function processLogin() {
            let id = document.getElementById("login-id").value.trim();
            let pw = document.getElementById("login-pw").value.trim();
            let res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, pw })
            });
            let data = await res.json();
            if (data.success) {
                currentUser = id;
                localStorage.setItem("active_user", id);
                showBoardScreen(id);
            } else { alert("로그인 실패"); }
        }

        function showBoardScreen(user) {
            changeScreen('board');
            document.getElementById("display-user").innerText = user;
            let isAdmin = (user.toLowerCase() === 'admin');
            document.getElementById("badge-area").innerHTML = isAdmin ? "<span class='admin-badge'>관리자</span>" : "";
            document.getElementById("admin-control-panel").style.display = isAdmin ? "block" : "none";
            if (isAdmin) loadUsers();
            loadPosts();
        }

        function processLogout() {
            currentUser = null;
            localStorage.removeItem("active_user");
            changeScreen('login');
        }

        async function shareCode() {
            let title = document.getElementById("code-title").value.trim();
            let code = document.getElementById("html-code-input").value.trim();
            if (!title || !code) return alert("입력 오류");

            await fetch('/api/posts', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, title, code })
            });
            document.getElementById("code-title").value = "";
            document.getElementById("html-code-input").value = "";
            loadPosts();
        }

        async function loadPosts() {
            let res = await fetch('/api/posts');
            let posts = await res.json();
            let container = document.getElementById("posts-container");
            let isAdmin = (currentUser.toLowerCase() === 'admin');

            if (posts.length === 0) { container.innerHTML = "<div style='text-align:center; color:#666;'>공유된 코드 없음</div>"; return; }

            let html = "";
            posts.forEach(p => {
                let canDel = isAdmin || (p.author === currentUser);
                html += `
                    <div class="post-card">
                        <div class="post-author">${p.author}</div>
                        <div class="post-title">${p.title}</div>
                        <button class="run-code-btn" onclick="runPreview('${encodeURIComponent(p.title)}', '${encodeURIComponent(p.code)}')">실행 보기</button>
                        ${canDel ? `<button class="delete-btn" onclick="deletePost(${p.id})">삭제</button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function deletePost(id) {
            let isAdmin = (currentUser.toLowerCase() === 'admin');
            await fetch(`/api/posts/${id}`, {
                method: 'DELETE', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: currentUser, isAdmin })
            });
            loadPosts();
        }

        async function loadUsers() {
            let res = await fetch('/api/users');
            let users = await res.json();
            let container = document.getElementById("user-list-container");
            let html = "";
            for (let id in users) {
                if (id.toLowerCase() !== 'admin') {
                    html += `<div class="user-row"><span>${id}</span><button onclick="deleteUser('${id}')" style="background:#ff4444; color:#fff; border:none; padding:3px;">삭제</button></div>`;
                }
            }
            container.innerHTML = html || "회원 없음";
        }

        async function deleteUser(id) {
            await fetch(`/api/users/${id}`, { method: 'DELETE' });
            loadUsers();
            loadPosts();
        }

        function openChangePwModal() {
            let box = document.getElementById("pw-change-box");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        async function updatePassword() {
            let currentPw = document.getElementById("current-pw-input").value;
            let newPw = document.getElementById("new-pw-input").value;
            let res = await fetch('/api/password', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: currentUser, currentPw, newPw })
            });
            let data = await res.json();
            if (data.success) { alert("변경 완료"); openChangePwModal(); }
            else { alert(data.msg); }
        }

        function showQrCode() {
            let box = document.getElementById("qrcode-box");
            box.innerHTML = "";
            new QRCode(box, { text: window.location.href + "?qr=" + currentUser, width: 140, height: 140 });
            document.getElementById("qr-modal").style.display = "flex";
        }

        function closeQrModal() { document.getElementById("qr-modal").style.display = "none"; }
        function runPreview(t, c) {
            document.getElementById("modal-title").innerText = decodeURIComponent(t);
            let iframe = document.getElementById("preview-frame");
            document.getElementById("preview-modal").style.display = "flex";
            let doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open(); doc.write(decodeURIComponent(c)); doc.close();
        }
        function closePreview() { document.getElementById("preview-modal").style.display = "none"; }
    </script>
</body>
</html>
